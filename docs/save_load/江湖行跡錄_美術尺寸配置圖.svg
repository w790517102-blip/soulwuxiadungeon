<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 1320" width="1152" height="1320" font-family="sans-serif" font-size="12">
  <title>江湖行跡錄 美術尺寸配置圖（參考解析度 1152×648，單位 px）</title>
  <style>
    .bg{fill:#2a2a2a}.frame{fill:#14100d;stroke:#dbb860;stroke-width:3}
    .slot{fill:#14100d;stroke:#6b5629;stroke-width:2}.sel{fill:#380f0d;stroke:#d9ad47;stroke-width:3}
    .box{fill:none;stroke:#4fb3ff;stroke-width:1.5;stroke-dasharray:5 3}
    .dim{fill:#5a8fc0;font-size:12px}.t{fill:#e8dcc0;font-size:13px}.g{fill:#dbb860;font-size:14px}
    .btn{fill:#1c1712;stroke:#806633;stroke-width:2}.red{fill:#8f1d1d;stroke:#806633;stroke-width:2}
    .prev{fill:#000;stroke:#806633;stroke-width:2}.note{fill:#bbb;font-size:12px}
  </style>
  <rect class="bg" width="1152" height="1320"/>

  <!-- ============ A. 整體（0,0 起，1152×648） ============ -->
  <text x="16" y="-6" class="note"/>
  <rect x="0" y="0" width="1152" height="648" fill="#3a3a3a"/>
  <text x="8" y="14" class="note">A. 整體介面　畫面 1152×648（canvas_items 拉伸，等比 keep）　整個節點 ChronicleScreen = 全螢幕，Dim 半透明黑 α0.68</text>
  <rect class="frame" x="32" y="24" width="1088" height="600" rx="4"/>
  <text x="40" y="20" class="dim">Frame 32,24　1088×600（四周留 32／24 px）</text>
  <!-- title -->
  <text x="576" y="64" text-anchor="middle" class="g" font-size="30">江湖行跡錄</text>
  <text x="1096" y="58" text-anchor="end" class="t">儲存進度／讀取進度（模式字樣）</text>
  <rect x="56" y="84" width="1040" height="2" fill="#6b5629"/>
  <rect class="box" x="32" y="38" width="1088" height="46"/><text x="40" y="52" class="dim">標題區 y38–84（標題 30px 置中；右上模式字 18px）</text>
  <!-- grid -->
  <g id="grid">
    <rect class="sel" x="56" y="92" width="312" height="88" rx="3"/>
    <rect class="slot" x="376" y="92" width="312" height="88" rx="3"/>
    <rect class="slot" x="56" y="186" width="312" height="88" rx="3"/><rect class="slot" x="376" y="186" width="312" height="88" rx="3"/>
    <rect class="slot" x="56" y="280" width="312" height="88" rx="3"/><rect class="slot" x="376" y="280" width="312" height="88" rx="3"/>
    <rect class="slot" x="56" y="374" width="312" height="88" rx="3"/><rect class="slot" x="376" y="374" width="312" height="88" rx="3"/>
    <rect class="slot" x="56" y="468" width="312" height="88" rx="3"/><rect class="slot" x="376" y="468" width="312" height="88" rx="3"/>
  </g>
  <rect class="box" x="56" y="92" width="632" height="464"/>
  <text x="62" y="570" class="dim" transform="translate(0,-2)"> </text>
  <text x="696" y="236" class="dim" transform="rotate(-90 696 236)" text-anchor="middle">左：目錄 632×464（2欄×5列）</text>
  <!-- pager -->
  <rect class="btn" x="56" y="568" width="120" height="32"/><text x="116" y="589" text-anchor="middle" class="g">上一頁</text>
  <rect class="btn" x="568" y="568" width="120" height="32"/><text x="628" y="589" text-anchor="middle" class="g">下一頁</text>
  <text x="372" y="589" text-anchor="middle" class="t">第 1 / 10 頁</text>
  <!-- preview -->
  <rect class="prev" x="712" y="92" width="384" height="216"/>
  <rect x="716" y="96" width="376" height="208" fill="#3b4a60"/>
  <text x="904" y="205" text-anchor="middle" class="t">場景縮圖 376×208（16:9）</text>
  <text x="712" y="322" class="dim">右：預覽 384×216（外框 2px，內縮 4px）</text>
  <text x="712" y="354" class="g" font-size="26">存檔 01</text>
  <text x="712" y="386" class="t" font-size="17">時間：2026-10-12 14:38:45</text>
  <text x="712" y="418" class="t" font-size="17">所在場景：飲月山莊內</text>
  <text x="712" y="450" class="t" font-size="17">主線進度：第一章</text>
  <rect class="box" x="712" y="322" width="384" height="140"/>
  <rect class="red" x="712" y="568" width="184" height="36"/><text x="804" y="592" text-anchor="middle" class="g" font-size="18">儲存進度／讀取進度</text>
  <rect class="btn" x="912" y="568" width="184" height="36"/><text x="1004" y="592" text-anchor="middle" class="g" font-size="18">返回</text>
  <text x="808" y="560" text-anchor="middle" class="dim">操作按鈕 184×36　（間距 16）</text>

  <!-- ============ B. 單筆欄位詳圖（放大 1.5×） ============ -->
  <g transform="translate(0,700)">
    <text x="8" y="-6" class="note">B. 存檔欄位 312×88（此處放大 1.5×顯示 → 468×132）</text>
    <g transform="scale(1.5)">
      <rect class="sel" x="4" y="4" width="312" height="88" rx="3"/>
      <rect x="12" y="16" width="116" height="67" fill="#000" stroke="#806633"/>
      <rect x="14" y="18" width="112" height="63" fill="#3b4a60"/><text x="70" y="53" text-anchor="middle" font-size="9" fill="#fff">縮圖 112×63</text>
      <text x="136" y="28" class="g" font-size="14">存檔 01</text>
      <text x="136" y="54" class="t" font-size="11">飲月山莊內</text>
      <text x="136" y="74" class="dim" font-size="9">2026-10-12 14:38:45</text>
    </g>
    <g font-size="11" fill="#bbb">
      <text x="500" y="20">縮圖框：x8,y12　116×67（內縮 2px 放 112×63）</text>
      <text x="500" y="40">編號：x132,y6　168×26　20px　金</text>
      <text x="500" y="60">地圖：x132,y34　168×22　15px　超長以「…」截斷</text>
      <text x="500" y="80">日期：x132,y58　168×20　12px　淡</text>
      <text x="500" y="100">狀態：正常／Hover／選中／空白／異常（見規格書 §B）</text>
      <text x="500" y="120">欄位間距：左右 8　上下 6</text>
    </g>
  </g>

  <!-- ============ C. 確認視窗 ============ -->
  <g transform="translate(0,900)">
    <text x="8" y="-6" class="note">C. 確認視窗：全螢幕再疊一層 Dim α0.6 ＋ 面板 440×236 置中（x356,y196）</text>
    <rect x="0" y="0" width="1152" height="400" fill="#333"/>
    <g transform="translate(356,20)">
      <rect class="frame" x="0" y="0" width="440" height="236" rx="4"/>
      <text x="220" y="40" text-anchor="middle" class="g" font-size="22">是否覆蓋存檔 01？／確定要讀取這份進度嗎？</text>
      <text x="220" y="90" text-anchor="middle" class="t">內文 24px 邊距、16px、置中、最多 4～5 行</text>
      <text x="220" y="112" text-anchor="middle" class="t">（地點／日期；讀取時加「尚未儲存的進度將會遺失」）</text>
      <rect class="red" x="40" y="182" width="160" height="36"/><text x="120" y="205" text-anchor="middle" class="g" font-size="18">確認覆蓋</text>
      <rect class="btn" x="240" y="182" width="160" height="36"/><text x="320" y="205" text-anchor="middle" class="g" font-size="18">取消</text>
      <rect class="box" x="0" y="0" width="440" height="236"/>
    </g>
    <text x="576" y="320" text-anchor="middle" class="note">標題：面板內 y18、22px　內文：y62、h104　按鈕：y182、160×36，左右邊距 40，兩顆間距 80</text>
  </g>
</svg>
